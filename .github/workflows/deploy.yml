name: Deploy NADUfind to InfinityFree

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Upload website to InfinityFree
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # IDAGDAG ITO DITO
      - name: Check FTP configuration
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          test -n "$FTP_SERVER" && echo "FTP_SERVER is set" || echo "FTP_SERVER is missing"
          test -n "$FTP_USERNAME" && echo "FTP_USERNAME is set" || echo "FTP_USERNAME is missing"
          test -n "$FTP_PASSWORD" && echo "FTP_PASSWORD is set" || echo "FTP_PASSWORD is missing"
          test -n "$FTP_DIR" && echo "FTP_DIR is set" || echo "FTP_DIR is missing"

      # ITO ANG FTP DEPLOYMENT
      - name: Deploy website using FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR }}
          protocol: ftp
          port: 21
          timeout: 60000
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            config/db.php